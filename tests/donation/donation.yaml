- name: Droits de mutation à titre gratuit à son neveu ou sa nièce
  absolute_error_margin: 0.0625  # TODO expliquer cette marge d'erreur
  input:
    individus:
      A1: 
        age: 
          2025: 42
        existe_descendant_direct:
          2025: False
      A2:
        age: 
          2025: 42
        existe_descendant_direct:
          2025: True
      A3: 
        age: 
          2025: 42
        existe_descendant_direct:
          2025: False
      A4:
        age: 
          2025: 42
        existe_descendant_direct:
          2025: False
      B1:
        age: 
          2025: 42
      B2:
        age: 
          2025: 42
      B3:
        age: 
          2025: 42
      B4:
        age: 
          2025: 42
    
    donations:
      D1: 
        # (pas de descendant en ligne directe)
        donateur: A1
        neveu_niece_donataire: B1
        actif_brut_donne:
          2025: 1_000_000
      D2: 
        # (descendant en ligne directe existant)
        donateur: A2 
        neveu_niece_donataire: B2
        actif_brut_donne:
          2025: 1_000_000
      D3: 
        # (pas de descendant en ligne directe)
        donateur: A3
        neveu_niece_donataire: B3
        actif_brut_donne:
          2025: 100_000
      D4: 
        # (pas de descendant en ligne directe)  
        donateur: A4 
        neveu_niece_donataire: B4
        actif_brut_donne:
          2025: 10_000
  output:
    existe_descendant_direct_donateur:
      2025: [False, True, False, False]
    exoneration_don_familial:
      2025-01: [0, 0, 0, 0, 31_865, 0, 31_865, 31_865]
    abattement_plafond:
      2025-01: [0, 0, 0, 0, 7_967, 7_967, 7_967, 7_967]
    droits_mutation:
      2025-01: [0, 0, 0, 0, 528_092.40, 545_618.15, 33_092.40, 0]
      # Explication des montants attendus :
      # A1 n'a pas de descendant direct
      # (en D1, neveu ou nièce bénéficie de l'exonération pour descendant ligne directe puis de l'abattement neveu/nièce)
      # 1_000_000 - exonération 31_865 ligne directe - abattement 7_967 neveu/nièce = 960_168 €
      # 960_168 * 0.55 = 528_092.40 €
      #
      # A2 a un descendant direct (donc, en D2, pas d'exonération pour neveu nièce)
      # 1_000_000 - abattement 7_967 = 992_033 € 
      # 992_033 * 0.55 = 545_618,15 €
      #
      # A3 n'a pas de descendant direct
      # (en D3, neveu ou nièce bénéficie de l'exonération pour descendant ligne directe puis de l'abattement neveu/nièce)
      # 100_000 - exonération 31_865 ligne directe - abattement 7_967 neveu/nièce = 60_168
      # 60_168 * 0.55 = 33_092.40 €
      #
      # A4 n'a pas de descendant direct
      # (en D4, neveu ou nièce bénéficie de l'exonération pour descendant ligne directe puis de l'abattement neveu/nièce)
      # l'exonération de 31_865 est supérieure au montant d'actif brut donné
      # le droit de mutation à titre gratuit est donc de zéro


